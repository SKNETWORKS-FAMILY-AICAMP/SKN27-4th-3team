services:
  web:
    image: skn27-web:${SKN27_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: ops/docker/web.production.Dockerfile
    env_file:
      - ${SKN27_PRODUCTION_ENV_FILE:-../env/production.env.example}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      production_net:
        ipv4_address: 172.28.0.2

  api:
    image: skn27-api:${SKN27_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: ops/docker/backend.production.Dockerfile
    env_file:
      - ${SKN27_PRODUCTION_ENV_FILE:-../env/production.env.example}
    environment:
      - DJANGO_TRUSTED_PROXY_IPS=172.28.0.2
    depends_on:
      - postgres
    networks:
      production_net:
        ipv4_address: 172.28.0.10

  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - ${SKN27_PRODUCTION_ENV_FILE:-../env/production.env.example}
    volumes:
      - skn27_postgres_data:/var/lib/postgresql/data
    networks:
      production_net:
        ipv4_address: 172.28.0.11

volumes:
  skn27_postgres_data:

networks:
  production_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
