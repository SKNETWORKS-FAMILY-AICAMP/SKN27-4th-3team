services:
  api:
    build:
      context: ../..
      dockerfile: ops/docker/backend.Dockerfile
    env_file:
      - ../env/backend.env.example
    command: python -m uvicorn backend.config.asgi:application --host 0.0.0.0 --port 8000 --reload
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - ../env/backend.env.example
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pilot}
      POSTGRES_USER: ${POSTGRES_USER:-pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-db-password}
    ports:
      - "5432:5432"
    volumes:
      - pilot_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"

volumes:
  pilot_postgres_data:
