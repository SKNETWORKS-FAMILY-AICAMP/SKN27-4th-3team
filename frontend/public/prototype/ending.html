<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>거울 속의 손님 - 결과</title>
  <link rel="stylesheet" href="ending.css">
  <script src="ending.js" defer></script>
</head>
<body>
  <main class="result-page" data-result-page>
    <section class="result-card" aria-labelledby="result-title">
      <p class="result-kicker" data-result-kicker>사건 종료 기록</p>
      <h1 id="result-title" data-result-title>결과 확인</h1>
      <p class="result-summary" data-result-summary></p>

      <dl class="result-stats" aria-label="최종 상태">
        <div>
          <dt>승패</dt>
          <dd data-result-outcome>--</dd>
        </div>
        <div>
          <dt>턴</dt>
          <dd data-result-turn>--</dd>
        </div>
        <div>
          <dt>이성</dt>
          <dd data-result-sanity>--</dd>
        </div>
        <div>
          <dt>저주 흔적</dt>
          <dd data-result-curse>--</dd>
        </div>
        <div>
          <dt>진명 조각</dt>
          <dd data-result-truth>--</dd>
        </div>
      </dl>

      <section class="result-section" aria-labelledby="public-log-title">
        <h2 id="public-log-title">공개 로그</h2>
        <p data-result-log>기록된 공개 로그가 없습니다.</p>
      </section>

      <section class="result-section" aria-labelledby="style-title">
        <h2 id="style-title">플레이 스타일 요약</h2>
        <p data-result-style>정적 요약을 표시합니다.</p>
      </section>

      <div class="result-actions">
        <a class="result-button primary" href="game-background.html?fresh=1">처음부터 다시</a>
        <a class="result-button" href="game-background.html">의식장으로</a>
      </div>
    </section>
  </main>
</body>
</html>
