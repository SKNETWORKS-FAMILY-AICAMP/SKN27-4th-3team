<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>무명의 저주 종료 기록</title>
  <link rel="stylesheet" href="ending.css">
  <script src="ending.js" defer></script>
</head>
<body>
  <!--
    LLM EDIT GUIDE
    - This is the temporary post-game screen for the static prototype.
    - In Django, move this file into a template and pass outcome data from the view.
    - Keep the screen quiet: the result should feel like an in-world case record.
  -->
  <main class="ending-frame" data-ending-frame>
    <section class="ending-card" aria-labelledby="ending-title">
      <p class="ending-kicker" data-ending-kicker>무명의 저주 종료 기록</p>
      <h1 id="ending-title" data-ending-title>기록을 정리하는 중</h1>
      <p class="ending-summary" data-ending-summary>
        의식장의 검은 초가 낮게 흔들리고, 마지막 기록은 천천히 덮인다.
      </p>

      <dl class="ending-stats" aria-label="마지막 상태">
        <div>
          <dt>턴</dt>
          <dd data-ending-turn>--</dd>
        </div>
        <div>
          <dt>진명</dt>
          <dd data-ending-truth>--</dd>
        </div>
        <div>
          <dt>이성</dt>
          <dd data-ending-sanity>--</dd>
        </div>
        <div>
          <dt>저주</dt>
          <dd data-ending-curse>--</dd>
        </div>
      </dl>

      <div class="ending-actions">
        <a class="ending-button primary" href="game-background.html">다시 의식장으로</a>
        <a class="ending-button" href="game-background.html?fresh=1">처음부터 다시</a>
      </div>
    </section>
  </main>
</body>
</html>
